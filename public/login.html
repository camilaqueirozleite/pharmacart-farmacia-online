<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmaCart – Entrar</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header>
    <div class="topo">
      <a class="logo" href="/">PharmaCart <span>farmácia online</span></a>
      <nav id="menu"></nav>
    </div>
  </header>

  <main>
    <h1>Entrar</h1>
    <div id="mensagem" class="mensagem" role="alert" data-testid="mensagem"></div>

    <form id="form-login" class="cartao" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" data-testid="login-email">

      <label for="senha">Palavra-passe</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" data-testid="login-senha">

      <button type="submit" data-testid="login-submeter">Entrar</button>
      <p class="ajuda">Ainda não tem conta? <a href="/registo.html">Criar conta</a></p>
    </form>
  </main>

  <footer>PharmaCart · Projeto de Portfólio Pessoal · Mentoria em Testes de Software</footer>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      limparMensagem();
      try {
        const { token, usuario } = await api('/api/auth/login', {
          method: 'POST',
          body: {
            email: document.getElementById('email').value,
            senha: document.getElementById('senha').value
          }
        });
        Sessao.guardar(token, usuario);
        window.location.href = '/';
      } catch (erro) {
        mostrarMensagem(erro.message);
      }
    });

    if (new URLSearchParams(location.search).get('registo') === 'ok') {
      document.addEventListener('DOMContentLoaded', () =>
        mostrarMensagem('Conta criada com sucesso. Já pode entrar.', 'sucesso')
      );
    }
  </script>
</body>
</html>
